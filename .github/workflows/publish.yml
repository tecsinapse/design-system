name: publish

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Canal npm
        required: true
        type: choice
        options:
          - latest
          - legacy
          - beta

permissions:
  id-token: write
  contents: write

jobs:
  lerna:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v3
        with:
          runtime: node@22
          cache: true
          install: false

      - name: setup npm
        run: |
          pnpm add --global npm@12
          npm --version
          node -e 'const p=process.versions.node.split(".").map(Number); if (p[0] < 22 || (p[0] === 22 && p[1] < 14)) { console.error(process.version); process.exit(1) }'

      - name: install and prepare
        run: pnpm i

      - name: run test suites
        run: pnpm test

      - name: version and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          REF: ${{ github.ref_name }}
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          if [ "$CHANNEL" = latest ] && [ "$REF" != master ]; then
            echo "latest só roda na master (ref atual: $REF)"
            exit 1
          fi
          if [ "$CHANNEL" = legacy ] && [[ "$REF" != legacy/* ]]; then
            echo "legacy só roda em legacy/* (ref atual: $REF)"
            exit 1
          fi
          if [ "$CHANNEL" = beta ] && { [ "$REF" = master ] || [[ "$REF" == legacy/* ]]; }; then
            echo "beta não roda na master nem em legacy/* (ref atual: $REF)"
            exit 1
          fi

          if [ "$CHANNEL" = latest ]; then
            npx --yes lerna version --no-private --ignore-scripts --exact --conventional-commits --conventional-graduate --create-release github --sync-workspace-lock --yes
            npx --yes lerna publish from-git --ignore-scripts --yes
          elif [ "$CHANNEL" = legacy ]; then
            npx --yes lerna version --no-private --ignore-scripts --exact --conventional-commits --conventional-graduate --create-release github --sync-workspace-lock --yes
            npx --yes lerna publish from-git --ignore-scripts --dist-tag legacy --yes
          else
            OUTPUT=$(npx --yes lerna publish --canary --preid beta --dist-tag beta --no-private --ignore-scripts --yes)

            echo "$OUTPUT"

            PUBLISHED=$(echo "$OUTPUT" | grep -oE "@[^ ]+@[^ ]*beta[^ ]*")

            echo "published_packages<<EOF" >> $GITHUB_OUTPUT
            echo "$PUBLISHED" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

            echo "### 🚀 Betas publicados" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "$PUBLISHED" | sed 's/^/- `/; s/$/`/' >> $GITHUB_STEP_SUMMARY
          fi
